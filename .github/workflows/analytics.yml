name: GitHub Analytics

on:
  schedule:
    - cron: "0 6 1 * *" # first day of every month, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_analytics.py"
      - ".github/workflows/analytics.yml"

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate analytics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_analytics.py

      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-analytics.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub Analytics card"
            git push
          fi
